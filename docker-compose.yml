services:
  ai-api:
    build: .
    container_name: flowforge-ai-api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ai-postgres
      POSTGRES_PORT: 5432
      RABBITMQ_HOST: host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      FLOWFORGE_API_BASE_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    depends_on:
      ai-postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-worker:
    build: .
    container_name: flowforge-ai-worker
    command: ["python", "-m", "src.messaging.worker"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ai-postgres
      POSTGRES_PORT: 5432
      RABBITMQ_HOST: host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      FLOWFORGE_API_BASE_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ai-postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-postgres:
    image: pgvector/pgvector:pg17
    container_name: flowforge-ai-postgres

    environment:
      POSTGRES_DB: flowforgeai
      POSTGRES_USER: flowforgeai
      POSTGRES_PASSWORD: flowforgeai

    ports:
      - "5434:5432"

    volumes:
      - ai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U flowforgeai -d flowforgeai",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: flowforge-rabbitmq
    profiles:
      - standalone
    environment:
      RABBITMQ_DEFAULT_USER: flowforge
      RABBITMQ_DEFAULT_PASS: flowforge
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ai_postgres_data:
  rabbitmq_data:
