services:
  ai-postgres:
    image: pgvector/pgvector:pg17
    container_name: flowforge-ai-postgres

    environment:
      POSTGRES_DB: flowforgeai
      POSTGRES_USER: flowforgeai
      POSTGRES_PASSWORD: flowforgeai

    ports:
      - "5434:5432"

    volumes:
      - ai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U flowforgeai -d flowforgeai",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: flowforge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: flowforge
      RABBITMQ_DEFAULT_PASS: flowforge
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ai_postgres_data:
  rabbitmq_data: